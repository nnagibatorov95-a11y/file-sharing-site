<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>🔥 Файловый менеджер 🔥</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #ff8c00, #ff0000, #ff4500, #ff8c00);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      color: white;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 100, 0, 0.8);
    }

    p {
      margin: 10px 0;
      font-size: 1.1rem;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: white;
    }

    input[type="file"]::file-selector-button {
      background: #ff4500;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    input[type="file"]::file-selector-button:hover {
      background: #ff8c00;
    }

    button {
      background: #ff4500;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    button:hover {
      background: #ff8c00;
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(255, 100, 0, 0.7);
    }

    .links {
      margin-top: 20px;
    }

    .links a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
      transition: text-shadow 0.3s;
    }

    .links a:hover {
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1> Загрузить файл </h1>
    <p>Выберите файл и нажмите кнопку "Загрузить"</p>
    <form action="/upload" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" required />
      <button type="submit">Загрузить файл</button>
    </form>
    <div class="links">
      <a href="/">Обновить страницу</a>
    </div>
  </div>
</body>
</html>
